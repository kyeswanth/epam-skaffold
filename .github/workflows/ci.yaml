name: CI/CD

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: nginx

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Output Run ID
        run: echo ${{ github.run_id }}

      - name: Output Run Number
        run: echo ${{ github.run_number }}

      - name: Output Run Attempt
        run: echo ${{ github.run_attempt }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set TAG based on branch
        id: set-tag
        run: |
          if [[ $GITHUB_REF == refs/heads/dev ]]; then
            echo "ENV=dev" >> $GITHUB_ENV
            echo "TAG=dev-${GITHUB_SHA::7}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "ENV=staging" >> $GITHUB_ENV
            echo "TAG=stage-${GITHUB_SHA::7}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/production" ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
            echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi

      - name: Build and Push Docker Image
        run: |
          docker build -t s1thk/epam-argocd:${{ env.TAG }} .
          docker push s1thk/epam-argocd:${{ env.TAG }}

      - name: Install Kubectl and Kustomize
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          curl -Lo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/latest/download/kustomize_v4.5.7_linux_amd64.tar.gz
          tar -xvzf kustomize.tar.gz && chmod +x kustomize && sudo mv kustomize /usr/local/bin/

      - name: Set up Kubernetes Authentication
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > $HOME/.kube/config

      - name: Deploy to Kubernetes using Kustomize
        run: |
          kubectl apply -k k8s/overlays/${{ env.ENV }}
