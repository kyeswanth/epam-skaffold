name: CI/CD

on:
  push:
    branches:
      - main
      - dev
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set TAG based on branch
        id: set-tag
        run: |
          if [[ $GITHUB_REF == refs/heads/dev ]]; then
            echo "ENV=dev" >> $GITHUB_ENV
            echo "TAG=dev-${{ github.run_number }}" >> $GITHUB_ENV
          elif [[ $GITHUB_REF == "refs/heads/staging" ]]; then
            echo "ENV=staging" >> $GITHUB_ENV
            echo "TAG=stage-${{ github.run_number }}" >> $GITHUB_ENV
          elif [[ $GITHUB_REF == "refs/heads/main" ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
            echo "TAG=prod-${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Build and Push Docker Image
        run: |
          docker build -t s1thk/epam-argocd:$TAG .
          docker push s1thk/epam-argocd:$TAG

      - name: Print all GITHUB ENVs
        run: |
          printenv
