name: CI/CD

on:
  push:
    branches:
      - main
      - dev
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set TAG based on branch
        id: set-tag
        run: |
          if [[ $GITHUB_REF == refs/heads/dev ]]; then
            echo "ENV=dev" >> $GITHUB_OUTPUT
            echo "TAG=dev-${{} github.run_number }}" >> $GITHUB_OUTPUT
          elif [[ $GITHUB_REF == "refs/heads/staging" ]]; then
            echo "ENV=staging" >> $GITHUB_OUTPUT
            echo "TAG=stage-${{ github.run_number }}" >> $GITHUB_OUTPUT
          elif [[ $GITHUB_REF == "refs/heads/main" ]]; then
            echo "ENV=prod" >> $GITHUB_OUTPUT
            echo "TAG=prod-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker Image
        run: |
          docker build -t s1thk/epam-argocd:$TAG .
          docker push s1thk/epam-argocd:$TAG

      - name: Print all GITHUB ENVs
        run: |
          printenv

      - name: Install Kubectl and Kustomize
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          curl -Lo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/latest/download/kustomize_v4.5.7_linux_amd64.tar.gz
          tar -xvzf kustomize.tar.gz && chmod +x kustomize && sudo mv kustomize /usr/local/bin/
